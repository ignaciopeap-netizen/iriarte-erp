<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iriarte ERP V2</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./honorarios.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <form id="login-form" class="auth-card">
      <p class="eyebrow">Sonsoles Pérez Iriarte</p>
      <h1>Iriarte ERP</h1>
      <label>Email<input id="login-email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="login-password" type="password" autocomplete="current-password" required></label>
      <div id="login-error" class="error"></div>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </div>

  <div id="app-shell" class="shell hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">SPI</div>
        <div><strong>Sonsoles Pérez Iriarte</strong><small>JARDINERÍA Y PAISAJISMO</small></div>
      </div>
      <nav id="main-nav" class="main-nav"></nav>
      <div class="userbox"><span id="user-name"></span><button id="logout-btn" class="link-button">Salir</button></div>
    </header>
    <main id="app-view" class="app-view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./brand-data.js"></script>
  <script src="./print-logo-inject.js"></script>
  <script src="./db-bridge.js"></script>
  <script src="./app-core.js"></script>
  <script src="./project-actions.js"></script>
  <script src="./contacts-plus.js"></script>
  <script src="./enhancements.js"></script>
  <script src="./workflow-plus.js"></script>
  <script src="./invoice-pro.js"></script>
  <script src="./invoice-guard.js"></script>
  <script src="./presupuestos-plus.js"></script>
  <script src="./honorarios-plus.js"></script>
  <script src="./budget-workflow-fix.js"></script>
  <script src="./project-hub.js"></script>
  <script src="./billing-phases.js"></script>
  <script src="./purchases-plus.js"></script>
  <script src="./operations-plus.js"></script>
  <script src="./operations-edit.js"></script>
  <script src="./bank-import-pro.js"></script>
  <script src="./finance-view-fix.js"></script>
  <script src="./reports-plus.js"></script>
  <script src="./auto-open.js"></script>
</body>
</html>
