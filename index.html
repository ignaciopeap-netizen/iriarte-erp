<style>

.erpView{background:var(--erp-cream);min-height:calc(100vh - 64px);padding:24px;font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--erp-ink)}.erpHero{border-radius:14px;padding:28px;color:white;background:linear-gradient(90deg,rgba(49,69,42,.94),rgba(49,69,42,.62)),url("https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=1600&q=75") center/cover;box-shadow:var(--erp-shadow);margin-bottom:16px}.erpHero h1{font:38px Georgia,serif;margin:0 0 4px}.erpHero p{margin:0;letter-spacing:2.5px;font-size:10px}.erpHead{display:flex;align-items:center;gap:10px;margin-bottom:16px}.erpHead h1{font:30px Georgia,serif;margin:0}.erpHead .grow{flex:1}.erpBtn{border:1px solid var(--erp-line);background:white;padding:9px 13px;border-radius:7px;cursor:pointer;color:var(--erp-ink)}.erpBtn:hover{border-color:#aaa38f}.erpBtn.primary{background:var(--erp-green2);color:white;border-color:var(--erp-green2)}.erpBtn.danger{color:#9b4b38}.erpGrid6{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.erpGrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.erpGrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.erpGrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.erpCard{background:var(--erp-paper);border:1px solid #e5e0d5;border-radius:11px;box-shadow:var(--erp-shadow)}.erpKpi{padding:15px}.erpKpi small{color:var(--erp-muted);font-size:11px}.erpKpi strong{display:block;font:23px Georgia,serif;margin-top:4px}.erpPanel{padding:16px}.erpPanel h3{font:18px Georgia,serif;margin:0 0 12px}.erpPanel h4{margin:16px 0 8px}.erpTableWrap{overflow:auto}.erpTable{width:100%;border-collapse:collapse;min-width:680px}.erpTable th,.erpTable td{padding:9px;border-bottom:1px solid #e8e3d8;text-align:left;font-size:12px;vertical-align:top}.erpTable th{color:var(--erp-muted);font-weight:600;background:#faf8f2;position:sticky;top:0}.erpTable tr.clickable{cursor:pointer}.erpTable tr.clickable:hover{background:#f0f1e9}.erpBadge{display:inline-block;padding:4px 7px;border-radius:999px;background:#ece9df;font-size:10px}.erpBadge.good{background:#e2ecdf;color:#3d6938}.erpBadge.warn{background:#f6ead4;color:#8a6128}.erpBadge.bad{background:#f5dfd7;color:#954f3b}.erpMasterDetail{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px}.erpMaster,.erpDetail{padding:14px}.erpItem{padding:11px;border-bottom:1px solid #e8e3d8;border-radius:7px;cursor:pointer}.erpItem:hover,.erpItem.active{background:#edf0e8}.erpItem b{display:block}.erpItem small{color:var(--erp-muted)}.erpSearch{width:100%;border:1px solid var(--erp-line);border-radius:8px;padding:9px 11px;background:white;margin-bottom:10px}.erpInfoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.erpInfo{border:1px solid #e5e0d4;border-radius:8px;padding:11px;background:white}.erpInfo small{display:block;color:var(--erp-muted);font-size:10px;margin-bottom:4px}.erpRight{text-align:right}.erpMuted{color:var(--erp-muted)}.erpPositive{color:#52744a}.erpNegative{color:#9a573d}.erpActions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.erpFlow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.erpFlow div{padding:9px 6px;text-align:center;border:1px solid var(--erp-line);border-radius:7px;background:#f8f6ef;font-size:11px}.erpFlow .done{background:#e5ebdf}.erpFlow .now{background:var(--erp-green2);color:white}.erpEmpty{padding:28px;text-align:center;color:var(--erp-muted);border:1px dashed #cec8b9;border-radius:10px;background:#faf9f4}.erpNotice{padding:10px 12px;border-radius:8px;background:#fff3d8;color:#74591b;margin:10px 0}.erpError{padding:10px 12px;border-radius:8px;background:#f7dfd8;color:#8d4934;margin:10px 0}.erpModal{display:none;position:fixed;inset:0;z-index:500;background:rgba(25,31,23,.38);align-items:center;justify-content:center;padding:20px}.erpModal.open{display:flex}.erpModalBox{width:min(760px,96vw);max-height:92vh;overflow:auto;background:var(--erp-paper);border-radius:13px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.erpModalHead{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--erp-line)}.erpModalHead h2{font:24px Georgia,serif;margin:0}.erpModalBody{padding:18px}.erpModalFoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--erp-line)}.erpFormGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.erpField label{display:block;font-size:11px;color:var(--erp-muted);margin-bottom:4px}.erpField input,.erpField select,.erpField textarea{width:100%;padding:9px;border:1px solid #d7d1c3;border-radius:7px;background:white;font:inherit}.erpField textarea{min-height:80px;resize:vertical}.erpField.full{grid-column:1/-1}.erpToast{position:fixed;right:18px;bottom:18px;z-index:700;display:none;max-width:360px;background:#24311f;color:white;padding:11px 14px;border-radius:8px;box-shadow:0 8px 30px #0003;font:12px Inter,system-ui}.erpToast.show{display:block}.erpToolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.erpToolbar select,.erpToolbar input{border:1px solid var(--erp-line);border-radius:7px;padding:8px;background:white}.erpDocPreview{background:white;border:1px solid var(--erp-line);padding:36px;max-width:850px;margin:auto}
@media(max-width:1180px){#app{grid-template-columns:260px minmax(0,1fr)}#summary{display:none}.erpGrid6{grid-template-columns:repeat(3,1fr)}.erpGrid4{grid-template-columns:repeat(2,1fr)}.erpGrid3{grid-template-columns:1fr}.erpMasterDetail{grid-template-columns:260px minmax(0,1fr)}}@media(max-width:820px){#moduleNav .navBrand{display:none}#app{grid-template-columns:1fr;padding:10px}#sidebar{position:static}#main{min-height:500px}.erpView{padding:14px}.erpMasterDetail,.erpGrid2{grid-template-columns:1fr}.erpGrid6,.erpGrid4{grid-template-columns:1fr 1fr}.erpInfoGrid,.erpFormGrid{grid-template-columns:1fr}.erpHero h1{font-size:30px}}@media(max-width:520px){.erpGrid6,.erpGrid4{grid-template-columns:1fr}}
</style>

<body>
<div id="lockScreen"><div id="lockBox"><div style="color:var(--ink-soft);font-size:11px">Sonsoles Pérez Iriarte</div><h3>Iriarte ERP</h3><div id="loginFields"><input id="loginEmail" type="email" placeholder="Email" autocomplete="username"><input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password"><div id="lockError"></div><button id="lockBtn">Entrar</button><button type="button" id="forgotBtn" class="linkBtn">¿Olvidaste tu contraseña?</button></div><div id="resetFields" style="display:none"><p style="font-size:12px;color:var(--ink-soft)">Escribe tu email y te enviaremos un enlace para crear una contraseña nueva.</p><input id="resetEmail" type="email" placeholder="Email"><div id="resetMsg" class="lockMsg"></div><button id="sendResetBtn">Enviar enlace</button><button type="button" id="backToLoginBtn" class="linkBtn">Volver</button></div><div id="newPasswordFields" style="display:none"><input id="newPassword1" type="password" placeholder="Nueva contraseña"><input id="newPassword2" type="password" placeholder="Repite la contraseña"><div id="newPasswordMsg" class="lockMsg"></div><button id="savePasswordBtn">Guardar contraseña</button></div></div></div>
<div id="moduleNav"><div class="navBrand"><div><b>Sonsoles Pérez Iriarte</b><small>JARDINERÍA Y PAISAJISMO</small></div></div><div class="navLinks" id="erpNav"><a class="navLink" data-erp-page="inicio" href="#">Inicio</a><a class="navLink" data-erp-page="clientes" href="#">Clientes</a><a class="navLink" data-erp-page="proyectos" href="#">Proyectos</a><a class="navLink active" data-erp-page="presupuestos" href="#">Presupuestos</a><a class="navLink" data-erp-page="facturas" href="#">Facturas</a><a class="navLink" data-erp-page="proveedores" href="#">Proveedores</a><a class="navLink" data-erp-page="compras" href="#">Compras</a><a class="navLink" data-erp-page="obra" href="#">Obra</a><a class="navLink" data-erp-page="horas" href="#">Horas</a><a class="navLink" data-erp-page="documentos" href="#">Documentos</a><a class="navLink" data-erp-page="finanzas" href="#">Finanzas</a><a class="navLink" data-erp-page="gastos" href="#">Gastos generales</a><a class="navLink" data-erp-page="informes" href="#">Informes</a></div><div class="navUser" id="navUser"></div></div>
<div id="syncStatus">Conectando…</div><div id="app"><div id="sidebar"><div class="kindTabs"><button class="kindTab active" id="kindTabObra">Obra</button><button class="kindTab" id="kindTabHonorarios">Honorarios</button></div><button id="newProjectBtn">+ Nuevo proyecto</button><div class="kindTabs"><button class="kindTab active" data-filter="todos">Todos</button><button class="kindTab" data-filter="presupuestos">Presupuestos</button><button class="kindTab" data-filter="proyectos">Proyectos</button></div><input id="searchInput" placeholder="Buscar proyecto o cliente…"><label id="archiveToggle"><input type="checkbox" id="archiveCheckbox"> Ver archivados</label><ul id="projectList"></ul></div><div id="main"><div id="topbar"><div class="viewTabs"><button class="viewTab active" data-view="edit">Trabajo</button><button class="viewTab" data-view="client">Vista cliente</button><button class="viewTab" data-view="supplier">Vista proveedor</button><button class="viewTab" data-view="admin" id="adminTabBtn" style="display:none">Resumen equipo</button></div><div id="topbarRight"></div></div><div id="content"></div></div><div id="summary"></div></div><div id="erpView" class="erpView" style="display:none"></div><div id="erpModal" class="erpModal"></div><div id="erpToast" class="erpToast"></div>

<script>
(function(){
"use strict";
const SUPABASE_URL="https://kzmjeccivhkhtuokfkta.supabase.co";
const SUPABASE_KEY="sb_publishable_YBf9vRaOlVQBHM4ionZLPw_TIIxZY9G";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.__iriarteSupabase=sb;window.getSupabase=()=>sb;
window.uid=()=>crypto.randomUUID();window.fmtMoney=v=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(v||0));window.escapeHtml=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));window.escapeAttr=window.escapeHtml;window.formatSpanishDate=v=>{if(!v)return"";let d=new Date(String(v).length===10?v+"T12:00:00":v);return isNaN(d)?v:d.toLocaleDateString("es-ES")};window.setSyncStatus=t=>{const e=document.getElementById("syncStatus");if(e)e.textContent=t||""};window.initModuleNav=()=>{};window.getIriarteSession=()=>window.__iriarteSession||null;
const db=()=>sb;
const state={projects:[],selectedId:null,currentKind:"obra",filter:"todos",showArchived:false,view:"edit",currentUser:null,clientes:[],proyectosMap:{}};window.state=state;const PRESUPUESTOS_TABLE="presupuestos";
function newProjectObj(name="Nuevo presupuesto",kind="obra"){return{id:uid(),kind,name,client:"",address:"",date:new Date().toISOString().slice(0,10),ref:"",phase:"Borrador",expte:"",irpf_enabled:false,irpf_pct:15,items:[],status:"presupuesto",archived:false,intro_text:"",zonas:[],scope_items:[],redaccion_toggle:false,redaccion_texto:"",fases_obra:[],direccion_resumen:"",fee_lines:[],clausulas:""}}
function selected(){return state.projects.find(p=>String(p.id)===String(state.selectedId))||null}function total(p){return (p.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0)}
async function loadProjects(){let{data,error}=await db().from(PRESUPUESTOS_TABLE).select("*").order("updated_at",{ascending:false});if(error){console.error(error);setSyncStatus("Error cargando presupuestos");state.projects=[]}else state.projects=(data||[]).map(r=>({...r,items:r.items||[]}));if(!state.selectedId&&state.projects[0])state.selectedId=state.projects[0].id}
async function saveProject(p){p.updated_at=new Date().toISOString();let{error}=await db().from(PRESUPUESTOS_TABLE).upsert(p);if(error){console.error(error);alert("No se pudo guardar: "+error.message);return false}setSyncStatus("Guardado");return true}
function renderList(){let ul=document.getElementById("projectList"),q=(document.getElementById("searchInput").value||"").toLowerCase();let rows=state.projects.filter(p=>(state.showArchived||!p.archived)&&(!q||(`${p.name} ${p.client}`).toLowerCase().includes(q)));ul.innerHTML=rows.map(p=>`<li data-id="${p.id}" class="${String(p.id)===String(state.selectedId)?"active":""}"><b>${escapeHtml(p.name)}</b><div style="font-size:11px;color:var(--ink-soft)">${escapeHtml(p.client||"")}</div></li>`).join("");ul.querySelectorAll("li").forEach(li=>li.onclick=()=>{state.selectedId=li.dataset.id;renderAll()})}
function renderSummary(){let p=selected(),el=document.getElementById("summary");if(!p){el.innerHTML="";return}let b=total(p),iva=(p.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0)*(+i.vat||21)/100,0),irpf=p.irpf_enabled?b*(+p.irpf_pct||15)/100:0;el.innerHTML=`<h3 style="font:20px Georgia,serif;margin-top:0">Resumen</h3><div style="font-size:12px;color:var(--ink-soft)">Base imponible</div><div style="font-size:24px;font-family:Georgia,serif">${fmtMoney(b)}</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div style="display:flex;justify-content:space-between"><span>IVA</span><b>${fmtMoney(iva)}</b></div>${p.irpf_enabled?`<div style="display:flex;justify-content:space-between"><span>IRPF</span><b>− ${fmtMoney(irpf)}</b></div>`:""}<div style="display:flex;justify-content:space-between;margin-top:14px;font-size:18px"><b>Total</b><b>${fmtMoney(b+iva-irpf)}</b></div>`}
function renderEdit(){let p=selected(),c=document.getElementById("content");if(!p){c.innerHTML='<div class="erpEmpty">Crea o selecciona un presupuesto.</div>';return}c.innerHTML=`<div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px"><input data-f="name" value="${escapeAttr(p.name||"")}" placeholder="Nombre"><input data-f="client" value="${escapeAttr(p.client||"")}" placeholder="Cliente"><input data-f="date" type="date" value="${escapeAttr(p.date||"")}"></div><div style="display:grid;grid-template-columns:110px 1fr 120px 100px 110px 90px 44px;gap:7px;font-size:11px;color:var(--ink-soft);margin-bottom:6px"><b>Código</b><b>Descripción</b><b>Ubicación</b><b>Cant.</b><b>Precio</b><b>IVA %</b><span></span></div><div id="budgetLines">${(p.items||[]).map((i,n)=>`<div class="budgetLine" data-n="${n}" style="display:grid;grid-template-columns:110px 1fr 120px 100px 110px 90px 44px;gap:7px;margin-bottom:7px"><input data-k="code" value="${escapeAttr(i.code||"")}"><input data-k="description" value="${escapeAttr(i.description||"")}"><input data-k="location" value="${escapeAttr(i.location||"")}"><input data-k="qty" type="number" step="0.01" value="${i.qty||0}"><input data-k="price" type="number" step="0.01" value="${i.price||0}"><input data-k="vat" type="number" value="${i.vat??21}"><button data-del="${n}" style="border:0;background:#f3e8e2;border-radius:6px">×</button></div>`).join("")}</div><div class="erpActions" style="margin-top:14px"><button class="erpBtn" id="addLineBtn">+ Añadir línea</button><button class="erpBtn primary" id="saveBudgetBtn">Guardar</button><button class="erpBtn" id="clientViewBtn">Vista cliente</button><button class="erpBtn" id="supplierViewBtn">Vista proveedor</button></div>`;c.querySelectorAll("[data-f]").forEach(x=>x.oninput=()=>p[x.dataset.f]=x.value);c.querySelectorAll(".budgetLine input").forEach(x=>x.oninput=()=>{let n=+x.closest(".budgetLine").dataset.n,k=x.dataset.k;p.items[n][k]=["qty","price","vat"].includes(k)?+x.value:x.value;renderSummary()});c.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{p.items.splice(+b.dataset.del,1);renderAll()});document.getElementById("addLineBtn").onclick=()=>{p.items.push({code:"",description:"",location:"",qty:1,price:0,vat:21});renderAll()};document.getElementById("saveBudgetBtn").onclick=async()=>{if(await saveProject(p)){await loadProjects();renderAll()}};document.getElementById("clientViewBtn").onclick=()=>{state.view="client";renderAll()};document.getElementById("supplierViewBtn").onclick=()=>{state.view="supplier";renderAll()}}
function renderDoc(kind){let p=selected(),c=document.getElementById("content");if(!p)return;let b=total(p);c.innerHTML=`<div class="erpDocPreview"><h1 style="font:32px Georgia,serif;color:var(--green)">${escapeHtml(p.name)}</h1><p>${escapeHtml(p.client||"")}</p><table class="erpTable"><thead><tr><th>Descripción</th><th>Ubicación</th><th>Cant.</th><th>${kind==="supplier"?"":"Precio"}</th></tr></thead><tbody>${(p.items||[]).map(i=>`<tr><td>${escapeHtml(i.description||"")}</td><td>${escapeHtml(i.location||"")}</td><td>${i.qty||0}</td><td>${kind==="supplier"?"":fmtMoney((+i.qty||0)*(+i.price||0))}</td></tr>`).join("")}</tbody></table>${kind==="client"?`<h2 style="text-align:right">${fmtMoney(b)}</h2>`:""}</div>`}
function renderAll(){renderList();if(state.view==="edit")renderEdit();else renderDoc(state.view);renderSummary();document.querySelectorAll(".viewTab").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view))}
function setupBudgetUI(){document.getElementById("newProjectBtn").onclick=async()=>{let p=newProjectObj("Nuevo presupuesto",state.currentKind);state.projects.unshift(p);state.selectedId=p.id;renderAll();await saveProject(p)};document.getElementById("searchInput").oninput=renderList;document.getElementById("archiveCheckbox").onchange=e=>{state.showArchived=e.target.checked;renderList()};document.getElementById("kindTabObra").onclick=()=>state.currentKind="obra";document.getElementById("kindTabHonorarios").onclick=()=>state.currentKind="honorarios";document.querySelectorAll(".viewTab").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;renderAll()})}
window.onAppReady=async function(profile){state.currentUser=profile;setupBudgetUI();await loadProjects();renderAll();setSyncStatus("Conectado")};
})();
</script>
<script>
(function(){

async function simplePage(cfg){let rows=[];try{rows=await q(cfg.table)}catch(e){E.view.innerHTML=head(cfg.title)+`<div class="erpError">${esc(e.message)}</div>`;return}E.view.innerHTML=head(cfg.title,`<button class="erpBtn primary" id="add">+ Nuevo</button>`)+(rows.length?`<div class="erpCard erpPanel"><div class="erpTableWrap"><table class="erpTable"><thead><tr>${cfg.cols.map(c=>`<th>${c.label}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cfg.cols.map(c=>`<td>${c.money?money(r[c.key]):esc(r[c.key]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`:empty(cfg.empty||"Todavía no hay registros."));document.getElementById("add").onclick=()=>form(cfg.newTitle||`Nuevo ${cfg.title.toLowerCase()}`,cfg.fields,async v=>{if(cfg.before)cfg.before(v);let{error}=await sb.from(cfg.table).insert(v);if(error)throw error})}
async function dashboard(){let [clientes,proyectos,facturas,compras,horas]=await Promise.all([q(tables.clientes).catch(()=>[]),q(tables.proyectos).catch(()=>[]),q(tables.facturas).catch(()=>[]),q(tables.compras).catch(()=>[]),q(tables.horas).catch(()=>[])]);let fact=facturas.reduce((s,x)=>s+(+x.total||+x.base_imponible||0),0),cost=compras.reduce((s,x)=>s+(+x.total||+x.base_imponible||0),0);E.view.innerHTML=`<div class="erpHero"><h1>Iriarte ERP</h1><p>GESTIÓN · PROYECTOS · OBRA · FINANZAS</p></div><div class="erpGrid6"><div class="erpCard erpKpi"><small>Clientes</small><strong>${clientes.length}</strong></div><div class="erpCard erpKpi"><small>Proyectos</small><strong>${proyectos.length}</strong></div><div class="erpCard erpKpi"><small>Facturación</small><strong>${money(fact)}</strong></div><div class="erpCard erpKpi"><small>Compras</small><strong>${money(cost)}</strong></div><div class="erpCard erpKpi"><small>Horas</small><strong>${horas.reduce((s,x)=>s+(+x.horas||0),0).toFixed(1)}</strong></div><div class="erpCard erpKpi"><small>Margen bruto</small><strong>${money(fact-cost)}</strong></div></div><div class="erpGrid2" style="margin-top:14px"><div class="erpCard erpPanel"><h3>Flujo de trabajo</h3><div class="erpFlow"><div class="done">Cliente</div><div class="done">Presupuesto</div><div class="now">Proyecto</div><div>Obra</div><div>Factura</div><div>Cobro</div></div></div><div class="erpCard erpPanel"><h3>Visión general</h3><p class="erpMuted">Todos los módulos comparten Supabase como fuente de datos. Los presupuestos creados en el editor quedan integrados dentro del ERP.</p></div></div>`}

async function reports(){let [p,f,c,h]=await Promise.all([q(tables.proyectos).catch(()=>[]),q(tables.facturas).catch(()=>[]),q(tables.compras).catch(()=>[]),q(tables.horas).catch(()=>[])]);E.view.innerHTML=head("Informes")+`<div class="erpCard erpPanel"><h3>Resumen ejecutivo</h3><div class="erpInfoGrid"><div class="erpInfo"><small>Proyectos</small><b>${p.length}</b></div><div class="erpInfo"><small>Facturas</small><b>${f.length}</b></div><div class="erpInfo"><small>Compras</small><b>${c.length}</b></div><div class="erpInfo"><small>Horas registradas</small><b>${h.reduce((s,x)=>s+(+x.horas||0),0).toFixed(1)}</b></div></div></div>`}
async function render(page){try{if(page==="inicio")return dashboard();if(page==="finanzas")return finance();if(page==="obra")return obra();if(page==="informes")return reports();const cfgs={clientes:{title:"Clientes",table:tables.clientes,cols:[{label:"Nombre",key:"nombre"},{label:"Email",key:"email"},{label:"Teléfono",key:"telefono"}],fields:[{label:"Nombre",name:"nombre"},{label:"Email",name:"email",type:"email"},{label:"Teléfono",name:"telefono"},{label:"Dirección",name:"direccion",full:true}]},proyectos:{title:"Proyectos",table:tables.proyectos,cols:[{label:"Proyecto",key:"nombre"},{label:"Estado",key:"estado"},{label:"Dirección",key:"direccion"}],fields:[{label:"Nombre",name:"nombre"},{label:"Dirección",name:"direccion"},{label:"Estado",name:"estado",value:"activo"}]},facturas:{title:"Facturas",table:tables.facturas,cols:[{label:"Número",key:"numero"},{label:"Estado",key:"estado"},{label:"Base",key:"base_imponible",money:true},{label:"Total",key:"total",money:true}],fields:[{label:"Número",name:"numero"},{label:"Fecha",name:"fecha",type:"date"},{label:"Base imponible",name:"base_imponible",type:"number"},{label:"IVA",name:"iva_pct",type:"number",value:"21"},{label:"Estado",name:"estado",value:"emitida"}],before:v=>{v.base_imponible=+v.base_imponible||0;v.iva_pct=+v.iva_pct||21;v.total=v.base_imponible*(1+v.iva_pct/100)}},proveedores:{title:"Proveedores",table:tables.proveedores,cols:[{label:"Nombre",key:"nombre"},{label:"CIF",key:"cif"},{label:"Email",key:"email"}],fields:[{label:"Nombre",name:"nombre"},{label:"CIF",name:"cif"},{label:"Email",name:"email"},{label:"Teléfono",name:"telefono"}]},compras:{title:"Compras",table:tables.compras,cols:[{label:"Concepto",key:"concepto"},{label:"Estado",key:"estado"},{label:"Base",key:"base_imponible",money:true},{label:"Total",key:"total",money:true}],fields:[{label:"Concepto",name:"concepto"},{label:"Fecha",name:"fecha",type:"date"},{label:"Base",name:"base_imponible",type:"number"},{label:"IVA",name:"iva_pct",type:"numb })();

<script>
(function(){
const sb=window.getSupabase();function showLock(x){document.getElementById("lockScreen").style.display=x?"flex":"none"}async function profile(user){let p={id:user.id,email:user.email||"",name:user.user_metadata?.name||user.email||"Usuario",role:"usuario"};try{let{data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();if(data)p={...p,...data,name:data.name||p.name}}catch(e){}return p}async function start(user){let p=await profile(user);window.__iriarteSession={user,p};showLock(false);document.getElementById("navUser").innerHTML=`${escapeHtml(p.name||p.email)} <button id="logoutBtn" style="border:0;background:transparent;color:#72766d">Salir</button>`;await window.onAppReady(p);window.dispatchEvent(new CustomEvent("iriarte:ready",{detail:{profile:p}}));document.getElementById("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()}}
async function boot(){let btn=document.getElementById("lockBtn"),err=document.getElementById("lockError");btn.onclick=async()=>{err.textContent="";btn.disabled=true;let r=await sb.auth.signInWithPassword({email:document.getElementById("loginEmail").value.trim(),password:document.getElementById("loginPassword").value});btn.disabled=false;if(r.error){err.textContent=r.error.message;return}await start(r.data.user)};document.getElementById("forgotBtn").onclick=()=>{document.getElementById("loginFields").style.display="none";document.getElementById("resetFields").style.display="block"};document.getElementById("backToLoginBtn").onclick=()=>{document.getElementById("resetFields").style.display="none";document.getElementById("loginFields").style.display="block"};document.getElementById("sendResetBtn").onclick=async()=>{let r=await sb.auth.resetPasswordForEmail(document.getElementById("resetEmail").value.trim(),{redirectTo:location.origin+location.pathname});document.getElementById("resetMsg").textContent=r.error?r.error.message:"Enlace enviado."};document.getElementById("savePasswordBtn").onclick=async()=>{let a=document.getElementById("newPassword1").value,b=document.getElementById("newPassword2").value,m=document.getElementById("newPasswordMsg");if(a.length<8||a!==b){m.textContent="Las contraseñas no coinciden.";return}let r=await sb.auth.updateUser({password:a});m.textContent=r.error?r.error.message:"Contraseña actualizada";if(!r.error&&r.data.user)await start(r.data.user)};const recovery=()=>{document.getElementById("loginFields").style.display="none";document.getElementById("resetFields").style.display="none";document.getElementById("newPasswordFields").style.display="block";showLock(true)};sb.auth.onAuthStateChange((ev,s)=>{if(ev==="PASSWORD_RECOVERY")recovery()});let{data:{session}}=await sb.auth.getSession();let hashType=new URLSearchParams(location.hash.replace(/^#/,"")).get("type");if(hashType==="recovery")recovery();else if(session?.user)await start(session.user)
