name: V2 checks

on:
  push:
    branches: [unified-v2]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -e
          for f in v2/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Verify referenced local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('v2/index.html').read_text(encoding='utf-8')
          refs=re.findall(r'(?:src|href)="\./([^"?#]+)', html)
          missing=[r for r in refs if not (Path('v2')/r).exists()]
          if missing:
              raise SystemExit('Missing V2 assets: '+', '.join(missing))
          print('All local V2 assets are present:', ', '.join(refs))
          PY
      - name: Guard known schema regressions
        run: |
          set -e
          if grep -R "base_imponible" v2 --include='*.js'; then
            echo "Do not use removed/non-canonical base_imponible in V2" >&2
            exit 1
          fi
          if grep -q 'src="./app.js"' v2/index.html; then
            echo "V2 must use app-core.js, not the removed monolithic app.js" >&2
            exit 1
          fi
          grep -q 'src="./app-core.js"' v2/index.html
          grep -q "v_proyectos_operativos" v2/app-core.js
          grep -q "from('proyectos')" v2/project-actions.js
          grep -q "crear_factura_desde_presupuesto_v2" v2/budget-workflow-fix.js
          grep -q "crear_factura_desde_fase_v2" v2/billing-phases.js
          grep -q "conciliar_movimiento_v2" v2/reconciliation-sync.js
          grep -q "v_control_integridad_erp" v2/reports-plus.js
          grep -q "estado.*anulada" v2/project-finance-guard.js
          if grep -q 'src="./bank-import-pro.js"' v2/index.html; then
            echo "Obsolete bank importer must not be loaded" >&2
            exit 1
          fi
          echo "Canonical V2 schema guards passed"
      - name: Guard critical module loading
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('v2/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script src="\./([^"]+)"></script>', html)
          pos={name:i for i,name in enumerate(scripts)}
          required=[
            'db-bridge.js','runtime-guard.js','app-core.js','auth-recovery.js','project-actions.js','contacts-plus.js',
            'document-upload.js','enhancements.js','reconciliation-sync.js','workflow-plus.js','invoice-pro.js','invoice-guard.js',
            'derived-status-guard.js','budget-workflow-fix.js','project-hub.js','project-finance-guard.js','billing-phases.js','bank-import-complete.js',
            'finance-view-fix.js','reports-plus.js','auto-open.js'
          ]
          missing=[x for x in required if x not in pos]
          if missing:
              raise SystemExit('Missing critical V2 scripts: '+', '.join(missing))
          if not pos['db-bridge.js'] < pos['runtime-guard.js'] < pos['app-core.js'] < pos['auth-recovery.js']:
              raise SystemExit('DB/runtime/auth bootstrap ordering is invalid')
          if not pos['app-core.js'] < pos['project-actions.js']:
              raise SystemExit('project-actions.js must load after app-core.js')
          if not pos['app-core.js'] < pos['document-upload.js'] < pos['enhancements.js']:
              raise SystemExit('document-upload.js must load after app-core.js and before enhancements.js')
          if not pos['reconciliation-sync.js'] < pos['workflow-plus.js']:
              raise SystemExit('reconciliation-sync.js must load before workflow-plus.js')
          if not pos['invoice-pro.js'] < pos['invoice-guard.js'] < pos['derived-status-guard.js']:
              raise SystemExit('Invoice guards must load after invoice-pro.js')
          if not pos['project-hub.js'] < pos['project-finance-guard.js'] < pos['billing-phases.js']:
              raise SystemExit('Project finance guard must load after project hub and before billing phases')
          print('Critical V2 module loading and ordering are correct')
          PY
      - name: Guard SQL workflow files
        run: |
          set -e
          test -f MIGRACION_FACTURA_DESDE_PRESUPUESTO_V2.sql
          test -f MIGRACION_FACTURA_DESDE_FASE_V2.sql
          test -f MIGRACION_CONCILIACION_V2.sql
          test -f MIGRACION_CONTROL_INTEGRIDAD_V2.sql
          test -f MIGRACION_IMPORTACION_BANCO_V2.sql
          grep -q "recalc_factura_totals" MIGRACION_FACTURA_DESDE_PRESUPUESTO_V2.sql
          grep -q "recalc_factura_totals" MIGRACION_FACTURA_DESDE_FASE_V2.sql
          grep -q "conciliar_movimiento_v2" MIGRACION_CONCILIACION_V2.sql
          grep -q "v_control_integridad_erp" MIGRACION_CONTROL_INTEGRIDAD_V2.sql
          grep -q "materializar_importacion_bancaria_conciliada_v2" MIGRACION_IMPORTACION_BANCO_V2.sql
          echo "Critical SQL workflow files are present"
