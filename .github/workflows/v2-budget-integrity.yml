name: V2 budget integrity

on:
  push:
    branches: [unified-v2]
  pull_request:
    branches: [main]

jobs:
  budget-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard project-first invoicing and orphan-budget control
        run: |
          set -e
          test -f MIGRACION_PROYECTO_PRIMERO_FACTURACION_V2.sql
          test -f MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          test -f MIGRACION_VALIDACION_PROYECTO_V2.sql
          test -f MIGRACION_NUEVO_PRESUPUESTO_REQUIERE_PROYECTO_V2.sql
          grep -q "Antes de facturar, vincula el presupuesto a un proyecto" MIGRACION_PROYECTO_PRIMERO_FACTURACION_V2.sql
          if grep -qi "insert into public.proyectos\|update public.presupuestos" MIGRACION_PROYECTO_PRIMERO_FACTURACION_V2.sql; then
            echo "Invoice creation must not create projects or mutate the source budget" >&2
            exit 1
          fi
          grep -q "proyecto_id is null" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "coalesce(archived,false)=false" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "security_invoker=true" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "proyectos_sin_cliente" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "proyectos_sin_codigo" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "horas_coste_cero" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "Todo proyecto debe estar vinculado a un cliente" MIGRACION_VALIDACION_PROYECTO_V2.sql
          grep -q "Todo proyecto debe tener un código" MIGRACION_VALIDACION_PROYECTO_V2.sql
          grep -q "Todo presupuesto nuevo debe pertenecer a un proyecto" MIGRACION_NUEVO_PRESUPUESTO_REQUIERE_PROYECTO_V2.sql
          grep -q "before insert on public.presupuestos" MIGRACION_NUEVO_PRESUPUESTO_REQUIERE_PROYECTO_V2.sql
          grep -q "El cliente del presupuesto debe coincidir con el cliente del proyecto" MIGRACION_NUEVO_PRESUPUESTO_REQUIERE_PROYECTO_V2.sql
          if grep -Eq "from\('proyectos'\)\.(insert|update)" v2/budget-workflow-fix.js; then
            echo "Budget workflow must link existing projects, not create or edit the project master" >&2
            exit 1
          fi
          grep -q "Primero crea un proyecto con cliente y código" v2/budget-workflow-fix.js
          grep -q "proyecto_id:p.id" v2/budget-workflow-fix.js
          grep -q "Vincular a proyecto existente" v2/budget-workflow-fix.js
          grep -q "mismo cliente" v2/budget-workflow-fix.js
          grep -q "Pendientes estructurales" v2/ux-finish.js
          grep -q "Horas sin coste imputado" v2/ux-finish.js
          test -f v2/expenses-plus.js
          grep -q 'src="./expenses-plus.js"' v2/index.html
          grep -q "window.iriarteEditExpense" v2/expenses-plus.js
          grep -q "criterio_reparto:pid?'proyecto_directo':'sin_repartir'" v2/expenses-plus.js
          grep -q "No crea ni modifica movimientos bancarios" v2/expenses-plus.js
          echo "Project-first and expense integrity guards passed"
