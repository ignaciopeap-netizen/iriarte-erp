name: V2 budget integrity

on:
  push:
    branches: [unified-v2]
  pull_request:
    branches: [main]

jobs:
  budget-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard project-first invoicing and orphan-budget control
        run: |
          set -e
          test -f MIGRACION_PROYECTO_PRIMERO_FACTURACION_V2.sql
          test -f MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          test -f MIGRACION_VALIDACION_PROYECTO_V2.sql
          test -f MIGRACION_NUEVO_PRESUPUESTO_REQUIERE_PROYECTO_V2.sql
          test -f MIGRACION_COMPRAS_PROYECTO_OBLIGATORIO_V2.sql
          test -f MIGRACION_COMPRAS_PROVEEDOR_OBLIGATORIO_V2.sql
          test -f MIGRACION_FACTURAS_CONTEXTO_OBLIGATORIO_V2.sql
          test -f MIGRACION_INTEGRIDAD_COMPRAS_PROVEEDOR_V2.sql
          test -f MIGRACION_GASTOS_ESTADO_PAGO_V2.sql
          test -f MIGRACION_VALIDACION_NUMERICA_PRESUPUESTOS_V2.sql
          grep -q "Antes de facturar, vincula el presupuesto a un proyecto" MIGRACION_PROYECTO_PRIMERO_FACTURACION_V2.sql
          if grep -qi "insert into public.proyectos\|update public.presupuestos" MIGRACION_PROYECTO_PRIMERO_FACTURACION_V2.sql; then
            echo "Invoice creation must not create projects or mutate the source budget" >&2
            exit 1
          fi
          grep -q "proyecto_id is null" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "coalesce(archived,false)=false" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "security_invoker=true" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "proyectos_sin_cliente" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "proyectos_sin_codigo" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "horas_coste_cero" MIGRACION_CONTROL_INTEGRIDAD_PRESUPUESTOS_V2.sql
          grep -q "Todo proyecto debe estar vinculado a un cliente" MIGRACION_VALIDACION_PROYECTO_V2.sql
          grep -q "Todo proyecto debe tener un código" MIGRACION_VALIDACION_PROYECTO_V2.sql
          grep -q "Todo presupuesto nuevo debe pertenecer a un proyecto" MIGRACION_NUEVO_PRESUPUESTO_REQUIERE_PROYECTO_V2.sql
          grep -q "before insert on public.presupuestos" MIGRACION_NUEVO_PRESUPUESTO_REQUIERE_PROYECTO_V2.sql
          grep -q "El cliente del presupuesto debe coincidir con el cliente del proyecto" MIGRACION_NUEVO_PRESUPUESTO_REQUIERE_PROYECTO_V2.sql
          grep -q "alter column proyecto_id set not null" MIGRACION_COMPRAS_PROYECTO_OBLIGATORIO_V2.sql
          grep -q "Toda compra debe pertenecer a un proveedor" MIGRACION_COMPRAS_PROVEEDOR_OBLIGATORIO_V2.sql
          grep -q "before insert or update of proveedor_id on public.compras" MIGRACION_COMPRAS_PROVEEDOR_OBLIGATORIO_V2.sql
          grep -q "compras_sin_proveedor" MIGRACION_INTEGRIDAD_COMPRAS_PROVEEDOR_V2.sql
          grep -q "security_invoker=true" MIGRACION_INTEGRIDAD_COMPRAS_PROVEEDOR_V2.sql
          grep -q "alter column proyecto_id set not null" MIGRACION_FACTURAS_CONTEXTO_OBLIGATORIO_V2.sql
          grep -q "alter column cliente_id set not null" MIGRACION_FACTURAS_CONTEXTO_OBLIGATORIO_V2.sql
          grep -q "gastos_estado_fecha_pago_coherente_v2" MIGRACION_GASTOS_ESTADO_PAGO_V2.sql
          grep -qi "not valid" MIGRACION_GASTOS_ESTADO_PAGO_V2.sql
          grep -q "validar_numericos_presupuesto_v2" MIGRACION_VALIDACION_NUMERICA_PRESUPUESTOS_V2.sql
          grep -q "guard_presupuesto_numericos_v2" MIGRACION_VALIDACION_NUMERICA_PRESUPUESTOS_V2.sql
          grep -q "el IVA debe estar entre 0%% y 100%%" MIGRACION_VALIDACION_NUMERICA_PRESUPUESTOS_V2.sql
          grep -q "precio no puede ser negativo" MIGRACION_VALIDACION_NUMERICA_PRESUPUESTOS_V2.sql
          if grep -Eq "from\('proyectos'\)\.(insert|update)" v2/budget-workflow-fix.js; then
            echo "Budget workflow must link existing projects, not create or edit the project master" >&2
            exit 1
          fi
          grep -q "Primero crea un proyecto con cliente y código" v2/budget-workflow-fix.js
          grep -q "proyecto_id:p.id" v2/budget-workflow-fix.js
          grep -q "Vincular a proyecto existente" v2/budget-workflow-fix.js
          grep -q "mismo cliente" v2/budget-workflow-fix.js
          grep -q 'name="proveedor_id" required' v2/enhancements.js
          grep -q 'name="proyecto_id" required' v2/enhancements.js
          grep -q "Toda compra debe pertenecer a un proveedor" v2/enhancements.js
          grep -q "Toda compra debe pertenecer a un proyecto" v2/enhancements.js
          grep -q "Toda compra debe permanecer vinculada a un proveedor y un proyecto" v2/purchases-plus.js
          grep -q "projectSel.required=true" v2/relational-ui.js
          grep -q "Toda factura, también en borrador, debe pertenecer a un proyecto" v2/invoice-guard.js
          grep -q "Pendientes estructurales" v2/ux-finish.js
          grep -q "Horas sin coste imputado" v2/ux-finish.js
          test -f v2/expenses-plus.js
          grep -q 'src="./expenses-plus.js"' v2/index.html
          grep -q "window.iriarteEditExpense" v2/expenses-plus.js
          grep -q "criterio_reparto:pid?'proyecto_directo':'sin_repartir'" v2/expenses-plus.js
          grep -q "No crea ni modifica movimientos bancarios" v2/expenses-plus.js
          grep -q "Marcado como pagado sin fecha de pago" v2/data-quality.js
          grep -q "Tiene fecha de pago pero está marcado como no pagado" v2/data-quality.js
          grep -q "La fecha de pago es anterior a la fecha del gasto" v2/data-quality.js
          grep -q "Importe total 0" v2/data-quality.js
          grep -q "Sin concepto ni número de factura" v2/data-quality.js
          echo "Project-first, supplier, budget numeric and expense integrity guards passed"
